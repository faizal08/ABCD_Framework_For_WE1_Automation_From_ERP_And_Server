# Target Epic or Backlog details for automation
erp.target.type=Epic
erp.target.name=EPIC-0008

# ==========================================
# TIMEOUTS & EXECUTION SETTINGS
# ==========================================
implicit.wait=10
explicit.wait=60

filter.name=TC_RG_
excel.name=EPIC_0008_Referal_Management.xlsx

